<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<title>Khảo Sát Tinh Thần Học Sinh</title>
<style>
:root{
  --green:#4d7a5e; --green-dark:#3d6350; --bg:#eef1ea; --card:#fbfcf9;
  --tile:#f4f6f0; --tile-sel:#e9f1ea; --border:#d7e0d4; --text:#243229;
  --muted:#71806f; --danger:#b3554d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:30}
.topbar{height:56px;background:#f7f8f5ee;backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
.topbar h1{flex:1;text-align:center;font-size:18px;margin:0}
.icon-btn{background:none;border:none;font-size:26px;color:var(--text);cursor:pointer;padding:4px 8px}
.progress{height:6px;background:#dfe5da}
.progress-fill{height:100%;width:0;background:var(--green);transition:.3s}
main{max-width:760px;margin:0 auto;padding:0 12px 40px}
.card{background:var(--card);border-radius:20px;padding:20px 16px;margin:16px 0;box-shadow:0 1px 2px #0001}
.step{display:none}.step.active{display:block}
h2{font-size:19px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.5}
.note{background:var(--tile-sel);border:1px dashed var(--green);color:var(--green-dark);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0;line-height:1.5}
.q{font-size:15.5px;font-weight:600;line-height:1.45;margin:0 0 10px}
.q .num{color:var(--green)}
.hint{color:var(--muted);font-weight:400;font-size:12.5px}
.field{margin:18px 0}
.field.missing{outline:2px solid var(--danger);outline-offset:8px;border-radius:10px}
.option{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--border);border-radius:14px;background:var(--tile);cursor:pointer;margin:8px 0;font-size:15px;line-height:1.4;transition:.15s}
.option input{position:absolute;opacity:0;pointer-events:none}
.box{width:22px;height:22px;border:2px solid var(--border);border-radius:7px;background:#fff;flex:none;margin-top:1px;position:relative;transition:.15s}
.option.selected{border-color:var(--green);background:var(--tile-sel)}
.option.selected .box{background:var(--green);border-color:var(--green)}
.option.selected .box::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--border);border-radius:999px;background:var(--tile);cursor:pointer;font-size:14px;transition:.15s}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.selected{background:var(--green);border-color:var(--green);color:#fff}
textarea,input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:14px;background:var(--tile);padding:12px;font:inherit;font-size:15px;color:var(--text);resize:vertical}
textarea:focus,input[type=text]:focus{outline:2px solid var(--green);border-color:var(--green)}
.legend{position:sticky;top:62px;z-index:20;background:var(--bg);padding:8px 4px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--border)}
.scale-head,.scale-row{display:grid;grid-template-columns:1fr repeat(3,52px);align-items:center}
.scale-head{color:var(--muted);font-weight:600;text-align:center}
.scale-head span:first-child{text-align:left}
.scale-row{padding:14px 0;border-bottom:1px solid var(--border)}
.scale-row p{margin:0;font-size:15px;line-height:1.45}
.sc{display:flex;justify-content:center;cursor:pointer}
.sc input{position:absolute;opacity:0;pointer-events:none}
.dot{width:30px;height:30px;border:2px solid var(--border);border-radius:50%;background:#fff;position:relative;transition:.15s}
.sc input:checked + .dot{background:var(--green);border-color:var(--green)}
.sc input:checked + .dot::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:9px;border-radius:50%;background:#fff}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--tile);font-size:22px;color:var(--green-dark);cursor:pointer}
.stepper b{font-size:20px;min-width:70px;text-align:center}
input[type=range]{width:100%;accent-color:var(--green)}
.range-out{font-weight:700;color:var(--green-dark)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 4px}
.btn-primary{background:var(--green);color:#fff;border:none;border-radius:999px;padding:15px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn-primary:active{background:var(--green-dark)}
.btn-ghost{background:none;border:none;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;padding:10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.endnote{text-align:center;color:var(--muted);padding:18px 0 8px}
#success{display:none;text-align:center;padding:40px 20px}
#success.show{display:block}
#success .btn-primary{margin:4px}
.backdrop{position:fixed;inset:0;z-index:40;display:none}
.backdrop.show{display:block}
.menu{position:fixed;top:60px;right:12px;z-index:50;display:none;min-width:230px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 28px #0003;overflow:hidden}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;background:none;border:none;font:inherit;font-size:14.5px;color:var(--text);cursor:pointer}
.menu button:active{background:var(--tile)}
.menu button.danger{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:60;background:#0006;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-card{background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;font-size:15px;line-height:1.55}
.modal-card .btn-primary{padding:10px 18px;font-size:14px}
</style>
